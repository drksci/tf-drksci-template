[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-script-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pytest>=8.0",
  "testcontainers>=4.8",
  "pytest-testinfra>=10.1",
  "pytest-xdist>=3.5",   # parallel test execution
]

[tool.hatch.build.targets.wheel]
packages = []

[tool.pytest.ini_options]
addopts = "-v --tb=short -p no:cacheprovider"
markers = [
  "slow: marks tests as slow (full script execution)",
  "smoke: marks tests as quick smoke checks",
]
